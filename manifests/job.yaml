apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${K8S_NAMESPACE}
  labels:
    app: inference-perf
    strategy: ${STRATEGY_NAME}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: ${JOB_DEADLINE_SECONDS}
  template:
    metadata:
      labels:
        app: inference-perf
        job-name: ${JOB_NAME}
    spec:
      restartPolicy: Never
      shareProcessNamespace: true
      containers:
        - name: inference-perf
          image: ${INFERENCE_PERF_IMAGE}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args: ["ulimit -n 65536 2>/dev/null || true; /workspace/.venv/bin/inference-perf --config_file /etc/config/config.yml; touch /data/shared/done"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${HF_SECRET_NAME}
                  key: ${HF_SECRET_KEY}
                  optional: true
          resources:
            requests:
              cpu: "${JOB_CPU_REQUEST}"
              memory: "${JOB_MEMORY_REQUEST}"
            limits:
              cpu: "${JOB_CPU_LIMIT}"
              memory: "${JOB_MEMORY_LIMIT}"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
            - name: results-volume
              mountPath: /data/reports
              subPath: ${STRATEGY_NAME}/reports
            - name: shared
              mountPath: /data/shared
            - name: dshm
              mountPath: /dev/shm
        - name: epp-scraper
          image: python:3.12-alpine
          command: ["sh", "/scripts/run_scraper.sh"]
          env:
            - name: METRICS_URL
              value: "${EPP_METRICS_URL}"
            - name: SCRAPE_DURATION
              value: "${JOB_DEADLINE_SECONDS}"
            - name: SCRAPE_INTERVAL
              value: "${SCRAPE_INTERVAL}"
            - name: METRICS_OUTPUT
              value: "/data/metrics/metrics.jsonl"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: scraper-scripts
              mountPath: /scripts
              readOnly: true
            - name: results-volume
              mountPath: /data/metrics
              subPath: ${STRATEGY_NAME}/metrics
            - name: shared
              mountPath: /data/shared
      volumes:
        - name: config-volume
          configMap:
            name: ${INFERENCE_PERF_CONFIGMAP}
        - name: scraper-scripts
          configMap:
            name: ${SCRAPER_CONFIGMAP}
        - name: results-volume
          persistentVolumeClaim:
            claimName: ${PVC_NAME}
        - name: shared
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
