# Program-aware LAS with half-life time decay
#
# Tracks cumulative service (tokens) per session. Sessions that have received
# less service get priority. Half-life decay means recent service counts more
# than older service.
#
# Parameters:
#   lasWeightService: 0.8     — weight for cumulative tokens served
#   lasWeightHeadWait: 0.2    — weight for head-of-line wait time
#   lasHalfLifeSeconds: 100   — half-life for exponential decay of service history

featureGates:
- flowControl

flowControl:
  defaultPriorityBand:
    fairnessPolicyRef: program-aware-fairness

plugins:
- type: program-aware-fairness
  parameters:
    lasWeightService: 0.8
    lasWeightHeadWait: 0.2
    lasHalfLifeSeconds: 100
