apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: modelserver
          command:
          - /bin/bash
          - -c
          - --
          args:
          - vllm serve --seed=42 --model=Qwen/Qwen3.6-35B-A3B-FP8 --served-model-name=Qwen/Qwen3.6-35B-A3B-FP8 --max-model-len=200002 --max-num-batched-tokens=8192 --max-num-seqs=64 --tensor-parallel-size=2 --kv-cache-dtype=fp8 --gpu-memory-utilization=0.8 --async-scheduling --enable-auto-tool-choice --tool-call-parser=qwen3_coder --reasoning-parser=qwen3
          env:
          - name: VLLM_LOGGING_LEVEL
            value: DEBUG
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                key: token
                name: hf-token
          resources:
            limits:
              cpu: '32'
              memory: 256Gi
              nvidia.com/gpu: 2
            requests:
              cpu: '16'
              memory: 128Gi
              nvidia.com/gpu: 2
          volumeMounts:
          - mountPath: /dev/shm
            name: shm
          - mountPath: /.cache
            name: torch-compile-cache
          - mountPath: /.triton
            name: triton-cache
          - mountPath: /.config
            name: vllm-config
          - mountPath: /.tensorrt_llm
            name: tensorrt-llm-cache
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: torch-compile-cache
        emptyDir: {}
      - name: triton-cache
        emptyDir: {}
      - name: vllm-config
        emptyDir: {}
      - name: tensorrt-llm-cache
        emptyDir: {}
